<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Private Invitation ✨</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti для праздничного салюта при согласии -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #090d16 0%, #1a103c 50%, #2b0c3f 100%);
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        select option {
            background: #1a103c;
            color: #f8fafc;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.05); }
        }
        .bunny-anim {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto relative select-none">

    <!-- Фоновые неоновые свечения -->
    <div class="absolute top-10 left-5 w-32 h-32 bg-pink-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-10 right-5 w-40 h-40 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Основной контейнер -->
    <div class="relative z-10 my-auto space-y-4">
        
        <!-- Шапка с зайчиком и романтикой -->
        <div class="glass rounded-3xl p-6 text-center shadow-2xl">
            <div class="text-5xl mb-3 bunny-anim inline-block filter drop-shadow-[0_0_15px_rgba(244,114,182,0.6)]">
                🐰🤍
            </div>
            <h1 class="text-2xl font-black bg-gradient-to-r from-pink-400 via-rose-300 to-purple-400 bg-clip-text text-transparent">
                Особенное приглашение
            </h1>
            <p class="text-xs text-slate-300 mt-1 font-medium tracking-wide">
                Только для той самой самурайши ✨
            </p>
        </div>

        <!-- Блок выбора деталей свидания -->
        <div id="booking-card" class="glass rounded-3xl p-5 space-y-4">
            
            <!-- Локация (Челябинск) -->
            <div>
                <label class="block text-xs font-semibold text-pink-300 mb-1.5 uppercase tracking-wider">📍 Атмосфера и место:</label>
                <select id="place-select" class="w-full bg-slate-900/80 border border-slate-700/80 rounded-2xl p-3.5 text-sm focus:border-pink-500 focus:ring-1 focus:ring-pink-500 outline-none transition">
                    <optgroup label="🍸 Ночной движ & Бары">
                        <option value="Gipsy Club">Gipsy Club (Танцы и вайб)</option>
                        <option value="Meet Point (Кировка)">Meet Point на Кировке</option>
                        <option value="The Бочка">The Бочка</option>
                        <option value="Malina Bar">Malina Bar</option>
                    </optgroup>
                    <optgroup label="🍽 Уютные места">
                        <option value="Ресторан «Облака»">Ресторан «Облака» (Вид на город)</option>
                        <option value="Barbaresco">Barbaresco</option>
                        <option value="Ресторан «Помидор»">Ресторан «Помидор»</option>
                    </optgroup>
                    <optgroup label="✨ Прогулка и ТРК">
                        <option value="ТРК «Родник»">ТРК «Родник» (Кино / Кофе)</option>
                        <option value="ТРК «Алмаз»">ТРК «Алмаз»</option>
                        <option value="Пешеходная Кировка">Кировка (Ночные фонари)</option>
                        <option value="Парк им. Гагарина">Парк им. Гагарина (Уединение)</option>
                    </optgroup>
                </select>
            </div>

            <!-- Дата -->
            <div>
                <label class="block text-xs font-semibold text-pink-300 mb-1.5 uppercase tracking-wider">📅 Когда идем:</label>
                <select id="date-select" class="w-full bg-slate-900/80 border border-slate-700/80 rounded-2xl p-3.5 text-sm focus:border-pink-500 focus:ring-1 focus:ring-pink-500 outline-none transition">
                    <!-- Заполняется JS -->
                </select>
            </div>

            <!-- Время -->
            <div>
                <label class="block text-xs font-semibold text-pink-300 mb-1.5 uppercase tracking-wider">⏰ Во сколько:</label>
                <select id="time-select" class="w-full bg-slate-900/80 border border-slate-700/80 rounded-2xl p-3.5 text-sm focus:border-pink-500 focus:ring-1 focus:ring-pink-500 outline-none transition">
                    <option value="18:00">18:00 — Вечерний кофе / Закат</option>
                    <option value="19:30">19:30 — Праздный ужин / Продленка</option>
                    <option value="21:00">21:00 — Ночной движ / Клуб</option>
                    <option value="23:00">23:00 — Полночный вайб</option>
                </select>
            </div>

            <!-- Кнопки управления (Отказ не предусмотрен) -->
            <div class="pt-2 space-y-2">
                <button type="button" id="btn-accept" onclick="acceptDate()" class="w-full bg-gradient-to-r from-pink-500 via-rose-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 py-4 rounded-2xl font-bold text-white shadow-[0_0_25px_rgba(244,114,182,0.4)] active:scale-95 transition text-base">
                    Согласна на свидание 💕
                </button>
                
                <!-- Кнопка «Отказаться» — интерактивный прикол: при попытке нажать текст меняется или кнопка исчезает -->
                <button type="button" id="btn-refuse" onclick="handleRefusal()" class="w-full bg-slate-800/40 hover:bg-slate-800/80 text-slate-400 py-2.5 rounded-xl text-xs font-medium border border-slate-700/50 transition">
                    Сомневаюсь / Не хочу
                </button>
            </div>
        </div>

        <!-- Экран успешного подтверждения (скрыт по умолчанию) -->
        <div id="success-card" class="glass rounded-3xl p-8 text-center hidden space-y-4">
            <div class="text-6xl animate-bounce">💖</div>
            <h2 class="text-xl font-bold text-pink-300">Договорились!</h2>
            <p id="success-text" class="text-sm text-slate-300 leading-relaxed">
                Твой выбор зафиксирован в системе. Готовься, будет жарко 🔥
            </p>
            <div class="pt-2">
                <span class="inline-block bg-pink-500/20 text-pink-300 text-xs px-4 py-2 rounded-full border border-pink-500/30 font-medium">
                    Скриншоть экран и скидывай мне 🥂
                </span>
            </div>
        </div>

    </div>

    <!-- Подвал -->
    <footer class="text-center text-[10px] text-slate-500 py-2 tracking-widest uppercase">
        Personal Date Engine • Chelyabinsk Edition
    </footer>

    <script>
        // Заполнение дат текущего месяца
        const dateSelect = document.getElementById('date-select');
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const monthsNames = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        for (let day = 1; day <= daysInMonth; day++) {
            let option = document.createElement('option');
            let formattedDay = day < 10 ? '0' + day : day;
            option.value = ${formattedDay} ${monthsNames[month]};
            option.text = ${day} ${monthsNames[month]};
            if (day === now.getDate()) {
                option.selected = true;
            }
            dateSelect.appendChild(option);
        }

        // Счетчик попыток нажать на «Отказаться» (угораем)
        let refusalClicks = 0;
        const refusalMessages = [
            "Кнопка не работает, увы 😉",
            "Сюда нельзя нажимать, выбирай первое!",
            "Отказы не принимаются системой 🛑",
            "Ну всё, ты обречена на свидание 💖",
            "Хватит ломаматься, жми розовую кнопку!"
        ];

        function handleRefusal() {
            const refusalBtn = document.getElementById('btn-refuse');
            if (refusalClicks < refusalMessages.length) {
                refusalBtn.innerText = refusalMessages[refusalClicks];
                refusalClicks++;
                // Слегка уменьшаем кнопку отказа с каждым кликом
                refusalBtn.style.transform = scale(${1 - refusalClicks * 0.08});
            } else {
                // На 6-й раз кнопка окончательно пропадает
                refusalBtn.style.display = 'none';
            }
        }

        // Кнопка согласия
        function acceptDate() {
            const place = document.getElementById('place-select').value;
            const date = document.getElementById('date-select').value;
            const time = document.getElementById('time-select').value;

            // Запускаем праздничный салют из сердечек
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#f472b6', '#fb7185', '#c084fc', '#ffffff']
            });

            // Прячем карточку выбора, показываем успех с деталями
            document.getElementById('booking-card').classList.add('hidden');
            const successCard = document.getElementById('success-card');
            successCard.classList.remove('hidden');

            document.getElementById('success-text').innerHTML = 
                Место: <b class="text-pink-300">${place}</b><br> +
                Дата: <b class="text-pink-300">${date} в ${time}</b><br><br> +
                Всё зафиксировано. Жду тебя! 🔥;
        }
    </script>
</body>
</html>
